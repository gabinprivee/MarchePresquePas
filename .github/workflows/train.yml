name: Entrainement de l'IA

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dependances
        run: npm install
      - name: Faire tourner l evolution
        run: node train.js
      - name: Sauvegarder la progression
        run: |
          git config user.name "evo-bot"
          git config user.email "evo-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Evolution automatique"
          git push
